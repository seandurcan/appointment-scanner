name: Build Appointment Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Appointment Scanner v1.1.0 source
        shell: bash
        run: |
          cat bundle/source.tgz.b64.* > source.tgz.b64
          base64 -d source.tgz.b64 > source.tgz
          tar -xzf source.tgz
          test -f AppointmentScanner-v1.1.0/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run tests and build debug APK
        working-directory: AppointmentScanner-v1.1.0
        shell: bash
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp AppointmentScanner-v1.1.0/app/build/outputs/apk/debug/app-debug.apk AppointmentScanner-v1.1.0.apk
          sha256sum AppointmentScanner-v1.1.0.apk > AppointmentScanner-v1.1.0.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppointmentScanner-v1.1.0-apk
          path: |
            AppointmentScanner-v1.1.0.apk
            AppointmentScanner-v1.1.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
