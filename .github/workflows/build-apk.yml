name: Build Appointment Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Appointment Scanner v1.1.0 source
        shell: bash
        run: |
          cat bundle/source.tgz.b64.* > source.tgz.b64
          base64 -d source.tgz.b64 > source.tgz
          tar -xzf source.tgz
          test -f AppointmentScanner-v1.1.0/settings.gradle.kts
          # API 37 is not yet published in the hosted Android SDK repository.
          sed -i 's/compileSdk = 37/compileSdk = 36/' AppointmentScanner-v1.1.0/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' AppointmentScanner-v1.1.0/app/build.gradle.kts
          # Keep AndroidX on API-36-compatible releases until API 37 is in the hosted SDK.
          sed -i 's/compose-bom:2026.09.00/compose-bom:2024.09.02/' AppointmentScanner-v1.1.0/app/build.gradle.kts
          sed -i 's/core-ktx:1.19.0/core-ktx:1.13.1/' AppointmentScanner-v1.1.0/app/build.gradle.kts
          sed -i 's/activity-compose:1.13.0/activity-compose:1.9.2/' AppointmentScanner-v1.1.0/app/build.gradle.kts
          sed -i 's/lifecycle-runtime-ktx:2.11.0/lifecycle-runtime-ktx:2.8.6/' AppointmentScanner-v1.1.0/app/build.gradle.kts
          sed -i 's/lifecycle-viewmodel-compose:2.11.0/lifecycle-viewmodel-compose:2.8.6/' AppointmentScanner-v1.1.0/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run tests and build debug APK
        working-directory: AppointmentScanner-v1.1.0
        shell: bash
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp AppointmentScanner-v1.1.0/app/build/outputs/apk/debug/app-debug.apk AppointmentScanner-v1.1.0.apk
          sha256sum AppointmentScanner-v1.1.0.apk > AppointmentScanner-v1.1.0.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppointmentScanner-v1.1.0-apk
          path: |
            AppointmentScanner-v1.1.0.apk
            AppointmentScanner-v1.1.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
